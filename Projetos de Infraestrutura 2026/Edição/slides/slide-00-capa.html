<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2e63">
  <title>Projetos de Infraestrutura 2026</title>

  <!-- Fontes locais (offline) -->
  <link rel="stylesheet" href="../fonts/inter/inter.css">
  <!-- Font Awesome local (offline) -->
  <link rel="stylesheet" href="../fonts/fontawesome/css/all.min.css">
  <!-- Estilos da Apresentação (offline) -->
  <link rel="stylesheet" href="../css/main.css">

</head>

<body>

  <!-- Onda de fundo decorativa animada com pontos de luz sutis -->
  <div class="bg-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
      <defs>
        <!-- Gradientes de luz discretos -->
        <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#49b7ff" stop-opacity="0.6" />
          <stop offset="60%" stop-color="#1d63be" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#0b2e63" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2f7de6" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#114894" stop-opacity="0" />
        </radialGradient>
        <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" />
        </filter>
      </defs>

      <!-- Linhas Onduladas Animadas -->
      <g class="bg-lines-group">
        <path class="wave-line wave-line-1" d="M -80 340 C 220 180, 520 520, 820 300 S 1220 160, 1520 340"
          stroke="rgba(73,183,255,.22)" stroke-width="2.2" />
        <path class="wave-line wave-line-2" d="M -80 410 C 270 240, 570 580, 870 360 S 1270 210, 1520 410"
          stroke="rgba(29,99,190,.16)" stroke-width="1.8" />
        <path class="wave-line wave-line-3" d="M -80 480 C 300 300, 620 620, 920 420 S 1300 270, 1520 480"
          stroke="rgba(73,183,255,.12)" stroke-width="1.2" />
        <path class="wave-line wave-line-4" d="M -80 260 C 180 380, 480 140, 780 240 S 1180 390, 1520 220"
          stroke="rgba(123,94,167,.10)" stroke-width="1" stroke-dasharray="8 12" />
      </g>

      <!-- Pontos de Luz Discretos Animados (Light Nodes com Flutuação 2D) -->
      <g class="bg-lights-group">
        <!-- Ponto 1: Superior Esquerdo -->
        <g class="light-node light-node-1">
          <circle class="light-orb" cx="140" cy="150" r="22" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="140" cy="150" r="3.5" fill="#49b7ff" />
        </g>

        <!-- Ponto 2: Centro Superior -->
        <g class="light-node light-node-2">
          <circle class="light-orb" cx="520" cy="100" r="18" fill="url(#glow-blue)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="520" cy="100" r="2.5" fill="#a0d4f5" />
        </g>

        <!-- Ponto 3: Centro Direito -->
        <g class="light-node light-node-3">
          <circle class="light-orb" cx="920" cy="220" r="24" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="920" cy="220" r="4" fill="#ffffff" />
        </g>

        <!-- Ponto 4: Superior Direito -->
        <g class="light-node light-node-4">
          <circle class="light-orb" cx="1260" cy="110" r="20" fill="url(#glow-blue)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="1260" cy="110" r="3" fill="#49b7ff" />
        </g>

        <!-- Ponto 5: Inferior Esquerdo -->
        <g class="light-node light-node-5">
          <circle class="light-orb" cx="280" cy="580" r="26" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="280" cy="580" r="3.5" fill="#38bdf8" />
        </g>

        <!-- Ponto 6: Inferior Direito -->
        <g class="light-node light-node-6">
          <circle class="light-orb" cx="1380" cy="520" r="22" fill="url(#glow-cyan)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="1380" cy="520" r="3" fill="#ffffff" />
        </g>

        <!-- Ponto 7: Centro Inferior -->
        <g class="light-node light-node-7">
          <circle class="light-orb" cx="720" cy="650" r="20" fill="url(#glow-blue)" filter="url(#blur-glow)" />
          <circle class="light-core" cx="720" cy="650" r="3" fill="#a0d4f5" />
        </g>
      </g>
    </svg>
  </div>

  <!-- DECK de Slides -->
  <main class="deck" id="deck" aria-live="polite">


    <!-- %%SLIDE_START%% -->
    <!-- ============================================================
         SLIDE 0 — Capa do Evento
    ============================================================ -->
    <section class="slide active" id="slide-0">

      <div class="slide-content"
        style="background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; height: 100%;">
        <h1 style="font-size: 4.5rem; color: #0b2e63; font-weight: 800; margin-bottom: 1rem;">
          Projetos de Infraestrutura de TI
        </h1>
        <p style="font-size: 1.8rem; color: #1d63be; font-weight: 500;">
          AA/GTI/UIT - 2026
        </p>

        <!-- Ícones Animados de Infraestrutura -->
        <div class="infra-icons" style="display: flex; gap: 40px; margin-top: 110px; color: #49b7ff; font-size: 3rem;">
          <i class="fa-solid fa-server infra-icon" style="--delay: 0s;"></i>
          <i class="fa-solid fa-network-wired infra-icon" style="--delay: 0.2s;"></i>
          <i class="fa-solid fa-cloud infra-icon" style="--delay: 0.4s;"></i>
          <i class="fa-solid fa-database infra-icon" style="--delay: 0.6s;"></i>
          <i class="fa-solid fa-shield-halved infra-icon" style="--delay: 0.8s;"></i>
        </div>
      </div>

      <style>
        .infra-icon {
          animation: floatIcon 3s ease-in-out infinite alternate;
          animation-delay: var(--delay);
          filter: drop-shadow(0 8px 16px rgba(73, 183, 255, 0.3));
          transition: transform 0.3s ease, color 0.3s ease;
          background: -webkit-linear-gradient(45deg, #1d63be, #49b7ff);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .infra-icon:hover {
          background: -webkit-linear-gradient(45deg, #0b2e63, #1d63be);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          transform: scale(1.2) translateY(-5px) !important;
        }

        @keyframes floatIcon {
          0% {
            transform: translateY(0);
          }

          100% {
            transform: translateY(-12px);
          }
        }
      </style>
    </section>
    <!-- %%SLIDE_END%% -->


  </main>

  <!-- BARRA DE NAVEGAÇÃO FIXA INFERIOR -->
  <nav class="nav-bar">
    <img src="../imagens/logo-codevasf.svg" alt="Codevasf" class="nav-logo">
    <div class="nav-center">
      <div class="prog-bar"><span id="prog-fill"></span></div>
      <div class="slide-count"><strong id="cur-slide">1</strong> / <span id="total-slides">11</span></div>
    </div>
    <div class="nav-btns">
      <button class="btn-nav" id="btn-grid"><i class="fa-solid fa-border-all"></i> Slides</button>
      <button class="btn-nav" id="btn-prev"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
      <button class="btn-nav" id="btn-next">Próximo <i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </nav>

  <!-- MODAL DE MINIATURAS DA APRESENTAÇÃO -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-header">
      <h3>Visão Geral dos Slides</h3>
      <button class="btn-close" id="btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="thumbs-grid" id="thumbs-grid"></div>
  </div>

  <!-- Scripts da Apresentação (offline) -->
  <script src="../js/app.js"></script>
</body>

</html>
